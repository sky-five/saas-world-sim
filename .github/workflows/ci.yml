name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache simulated history
        uses: actions/cache@v4
        with:
          path: .cache
          key: sim-${{ hashFiles('src/**') }}

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
